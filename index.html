<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地中海門徒與早期使徒宣教路徑互動地圖（30–100 AD）</title>
  <meta name="description" content="視覺化呈現耶穌門徒與早期使徒在公元 30–100 年間於地中海區域的宣教路徑、年代演進、多人複選比較與各地停留時間長度。" />
  <style>
    :root {
      --bg-app: #0d131d;
      --bg-panel: #141d2b;
      --bg-card: #1a2638;
      --bg-card-hover: #213148;
      --border-subtle: rgba(148, 163, 184, 0.22);
      --border-strong: rgba(148, 163, 184, 0.4);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-gold: #eab308;
      --accent-cyan: #38bdf8;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: grid;
      grid-template-rows: auto auto minmax(0, 46fr) minmax(0, 42fr);
      gap: 8px;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      padding: 8px 12px;
      background: radial-gradient(circle at 20% 10%, #172336 0%, var(--bg-app) 65%);
    }

    /* 1. 置頂年代播放與里程碑列 */
    .timeline-bar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      min-height: 44px;
      z-index: 20;
    }

    .play-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .year-chip-inline {
      background: rgba(234, 179, 8, 0.18);
      border: 1px solid rgba(234, 179, 8, 0.5);
      color: #fde047;
      font-weight: 700;
      font-size: 15px;
      padding: 3px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .tl-btn {
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      min-height: 32px;
    }

    .tl-btn.active-play {
      background: var(--accent-gold);
      color: #0b111a;
      border-color: var(--accent-gold);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
      height: 8px;
      min-width: 110px;
    }

    .milestone-btns {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 2px;
    }

    .ms-btn {
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid var(--border-subtle);
      background: rgba(30, 41, 59, 0.85);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 30px;
    }

    .ms-btn:hover, .ms-btn.active-ms {
      border-color: var(--accent-gold);
      color: #fde047;
      background: rgba(234, 179, 8, 0.14);
    }

    /* 2. 精簡單行門徒複選列 + 文獻來源篩選（不自動換行撐高） */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 5px 10px;
      min-height: 42px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .apostle-pills {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    .apostle-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
      user-select: none;
      min-height: 30px;
    }

    .apostle-chip:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .apostle-chip.active {
      color: #0b111a;
      border-color: transparent;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.25);
    }

    .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .source-toggle-group {
      display: inline-flex;
      align-items: center;
      background: #0e1622;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }

    .source-btn {
      padding: 3px 8px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      min-height: 28px;
    }

    .source-btn.active {
      background: #243652;
      color: #f8fafc;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.35);
    }

    /* 3. 上方全幅互動地圖 */
    .map-section {
      position: relative;
      background: #0c1726;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 0;
    }

    #med-map {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #med-map.dragging {
      cursor: grabbing;
    }

    .map-overlay-tl {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 4;
      max-width: calc(100% - 140px);
    }

    .legend-hud {
      background: rgba(13, 19, 29, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .map-controls-tr {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }

    .map-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: rgba(20, 29, 43, 0.92);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .map-btn:hover {
      background: #273954;
      border-color: var(--accent-cyan);
    }

    .map-btn.wide {
      width: auto;
      padding: 0 10px;
      font-size: 13px;
    }

    /* 4. 下半部：放大字體雙欄資訊區 */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 10px;
      min-height: 0;
    }

    .info-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .step-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-btn {
      padding: 4px 11px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      min-height: 32px;
    }

    .step-btn:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--accent-gold);
    }

    .step-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .narrative-scroll {
      overflow-y: auto;
      padding-right: 4px;
      font-size: 16.5px;
      line-height: 1.65;
      color: var(--text-secondary);
      scrollbar-width: thin;
    }

    .narrative-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .pill-source-canon {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.38);
    }

    .pill-source-trad {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.38);
    }

    .narrative-heading {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .duration-list {
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
    }

    .duration-row {
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 7px 10px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .duration-row:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }

    .duration-row.selected {
      border-color: var(--accent-gold);
      background: rgba(234, 179, 8, 0.1);
    }

    .duration-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .duration-val {
      font-size: 15px;
      color: var(--accent-gold);
      white-space: nowrap;
    }

    .bar-track {
      width: 100%;
      height: 11px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      gap: 2px;
    }

    .bar-seg {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .bar-caption {
      margin-top: 3px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    /* SVG 樣式 */
    .land-mass {
      fill: #243347;
      stroke: #3d5473;
      stroke-width: 1.2;
    }

    .region-label {
      fill: rgba(148, 163, 184, 0.42);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      pointer-events: none;
      user-select: none;
    }

    .city-label {
      fill: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      user-select: none;
      paint-order: stroke;
      stroke: #0c1726;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .route-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 0.2s ease;
    }

    .node-badge-text {
      fill: #090e17;
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      user-select: none;
    }

    /* 手機版緊湊排佈：保持單行橫向滑動，不撐高頁面 */
    @media (max-width: 860px) {
      html, body {
        overflow-x: hidden;
        overflow-y: auto;
        height: auto;
      }

      .app-shell {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
        grid-template-rows: auto auto 270px auto;
        gap: 6px;
        padding: 6px 8px 16px;
      }

      .timeline-bar {
        position: sticky;
        top: 0;
        grid-template-columns: 1fr;
        gap: 5px;
        padding: 6px 8px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      }

      .play-controls {
        justify-content: space-between;
      }

      .top-bar {
        padding: 5px 8px;
        gap: 6px;
      }

      .legend-hud {
        font-size: 12px;
        padding: 3px 8px;
        gap: 6px;
      }

      .bottom-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .info-panel {
        padding: 10px 12px;
      }

      .narrative-scroll, .duration-list {
        max-height: 290px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 1. 置頂播放欄 -->
    <header class="timeline-bar" aria-label="年代播放控制列">
      <div class="play-controls">
        <span class="year-chip-inline" id="year-hud">30 AD</span>
        <button class="tl-btn" id="play-btn">▶ 播放</button>
        <button class="tl-btn" id="speed-btn">1x</button>
      </div>

      <div class="slider-wrap">
        <span style="font-size:13px; color:var(--text-muted);">30</span>
        <input type="range" id="year-slider" min="30" max="100" value="30" step="1" aria-label="年代滑桿" />
        <span style="font-size:13px; color:var(--text-muted);">100</span>
      </div>

      <div class="milestone-btns">
        <button class="ms-btn" data-year="30">30 五旬節</button>
        <button class="ms-btn" data-year="49">49 耶路撒冷會議</button>
        <button class="ms-btn" data-year="64">64 羅馬大火逼迫</button>
        <button class="ms-btn" data-year="70">70 聖殿被毀</button>
        <button class="ms-btn" data-year="95">95 拔摩海島</button>
      </div>
    </header>

    <!-- 2. 門徒多選 + 正典/傳統單獨篩選列（單行不換行） -->
    <section class="top-bar" aria-label="門徒與文獻來源篩選">
      <div class="apostle-pills" id="apostle-pills" role="group" aria-label="門徒多選篩選"></div>

      <div class="source-toggle-group" role="group" aria-label="文獻來源篩選">
        <button class="source-btn active" data-source="all">全部來源</button>
        <button class="source-btn" data-source="canon">僅正典／早期文獻</button>
        <button class="source-btn" data-source="trad">僅虛線教會傳統</button>
      </div>
    </section>

    <!-- 3. 上方全幅互動地圖 -->
    <section class="map-section" aria-label="地中海宣教互動地圖">
      <div class="map-overlay-tl">
        <div class="legend-hud">
          <span>實線＝正典／早期文獻</span>
          <span>虛線＝教會傳統推估</span>
          <span>圓圈數字＝行程順序（1, 2, 3...）</span>
        </div>
      </div>

      <div class="map-controls-tr">
        <button class="map-btn" id="zoom-in" title="放大地圖">＋</button>
        <button class="map-btn" id="zoom-out" title="縮小地圖">－</button>
        <button class="map-btn wide" id="zoom-reset" title="重設視角">重設視角</button>
      </div>

      <svg id="med-map" viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="sea-grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
          </pattern>
        </defs>

        <g id="viewport-group">
          <rect x="-400" y="-300" width="1800" height="1100" fill="#0d1b2d" />
          <rect x="-400" y="-300" width="1800" height="1100" fill="url(#sea-grid)" />

          <path class="land-mass" d="M 345,45 L 435,45 L 455,95 L 485,155 L 520,185 L 505,198 L 475,172 L 458,205 L 438,195 L 448,150 L 415,115 L 365,110 L 345,85 Z" />
          <polygon class="land-mass" points="435,212 478,210 465,232 432,225" />
          <path class="land-mass" d="M 525,45 L 635,45 L 630,135 L 595,165 L 580,205 L 555,198 L 545,165 L 515,150 L 525,115 Z" />
          <polygon class="land-mass" points="555,235 628,238 625,248 553,245" />
          <path class="land-mass" d="M 635,115 L 725,105 L 835,105 L 875,145 L 865,205 L 775,215 L 690,210 L 642,175 Z" />
          <polygon class="land-mass" points="755,242 802,235 805,246 758,252" />
          <path class="land-mass" d="M 865,145 L 945,145 L 945,355 L 835,355 L 838,315 L 865,285 L 862,215 Z" />
          <path class="land-mass" d="M 240,265 L 365,272 L 495,295 L 645,325 L 765,332 L 838,332 L 838,440 L 240,440 Z" />
          <path class="land-mass" d="M 240,45 L 345,45 L 345,135 L 285,175 L 240,170 Z" />

          <text x="455" y="275" class="region-label">地中海 MEDITERRANEAN SEA</text>
          <text x="720" y="165" class="region-label">小亞細亞</text>
          <text x="555" y="120" class="region-label">希臘</text>
          <text x="735" y="385" class="region-label">埃及</text>

          <g id="routes-layer"></g>
          <g id="nodes-layer"></g>
          <g id="labels-layer"></g>
        </g>
      </svg>
    </section>

    <!-- 4. 下半部：放大字體雙欄資訊區 -->
    <section class="bottom-grid">
      <article class="info-panel">
        <div class="panel-header">
          <div class="panel-title">宣教站點與歷史敘事</div>
          <div class="step-nav">
            <button class="step-btn" id="prev-step">← 上一站</button>
            <span id="step-counter" style="font-size:14px; color:var(--text-muted); min-width:56px; text-align:center;">1 / 1</span>
            <button class="step-btn" id="next-step">下一站 →</button>
          </div>
        </div>
        <div class="narrative-scroll" id="narrative-content"></div>
      </article>

      <aside class="info-panel">
        <div class="panel-header">
          <div class="panel-title">各地停留時間比較（月數）</div>
          <span id="total-months-badge" style="font-size:13px; color:var(--accent-gold); font-weight:700;"></span>
        </div>
        <div class="duration-list" id="duration-list"></div>
      </aside>
    </section>
  </div>

  <script>
    const CITIES = {
      jerusalem:  { id: "jerusalem",  name: "耶路撒冷",   x: 888, y: 292 },
      damascus:   { id: "damascus",   name: "大馬士革",   x: 912, y: 242 },
      antioch:    { id: "antioch",    name: "敘利亞安提阿", x: 896, y: 185 },
      cyprus:     { id: "cyprus",     name: "塞浦路斯",   x: 780, y: 243 },
      ephesus:    { id: "ephesus",    name: "以弗所",     x: 662, y: 178 },
      patmos:     { id: "patmos",     name: "拔摩海島",   x: 632, y: 196 },
      corinth:    { id: "corinth",    name: "哥林多",     x: 562, y: 158 },
      rome:       { id: "rome",       name: "羅馬",       x: 412, y: 108 },
      spain:      { id: "spain",      name: "西班牙海岸", x: 268, y: 145 },
      alexandria: { id: "alexandria", name: "亞歷山卓",   x: 745, y: 334 },
      blacksea:   { id: "blacksea",   name: "黑海／小亞細亞北", x: 755, y: 95 }
    };

    const APOSTLES = [
      {
        id: "paul",
        name: "保羅",
        color: "#f59e0b",

    const state = {
      selectedIds: new Set(["paul", "peter", "mark"]),
      sourceFilter: "all",
      activeApostleId: "paul",
      selectedStopIndex: 0,
      year: 30,
      playing: false,
      playSpeed: 1,
      zoom: 1,
      panX: 0,
      panY: 0,
      isDragging: false,
      dragStartX: 0,
      dragStartY: 0
    };

    const svgEl = document.getElementById("med-map");
    const viewportEl = document.getElementById("viewport-group");
    const routesLayer = document.getElementById("routes-layer");
    const nodesLayer = document.getElementById("nodes-layer");
    const labelsLayer = document.getElementById("labels-layer");
    const pillsContainer = document.getElementById("apostle-pills");
    const narrativeEl = document.getElementById("narrative-content");
    const durationListEl = document.getElementById("duration-list");
    const yearSlider = document.getElementById("year-slider");
    const yearHud = document.getElementById("year-hud");
    const stepCounterEl = document.getElementById("step-counter");
    const prevStepBtn = document.getElementById("prev-step");
    const nextStepBtn = document.getElementById("next-step");
    const playBtn = document.getElementById("play-btn");
    const speedBtn = document.getElementById("speed-btn");
    const totalMonthsBadge = document.getElementById("total-months-badge");

    let playTimer = null;

    function getFilteredStops(apostle) {
      if (state.sourceFilter === "all") return apostle.stops;
      return apostle.stops.filter(st => st.source === state.sourceFilter);
    }

    function getSelectedApostles() {
      return APOSTLES.filter(a => state.selectedIds.has(a.id));
    }

    function ensureSelectionValid() {
      const selected = getSelectedApostles();
      if (selected.length === 0) {
        state.selectedIds.add("paul");
        state.activeApostleId = "paul";
        state.selectedStopIndex = 0;
      }
      if (!state.selectedIds.has(state.activeApostleId)) {
        state.activeApostleId = Array.from(state.selectedIds)[0];
        state.selectedStopIndex = 0;
      }
      const active = APOSTLES.find(a => a.id === state.activeApostleId);
      const stops = getFilteredStops(active);
      if (stops.length > 0 && state.selectedStopIndex >= stops.length) {
        state.selectedStopIndex = 0;
      }
    }

    function renderPills() {
      pillsContainer.innerHTML = "";
      APOSTLES.forEach(ap => {
        const isSelected = state.selectedIds.has(ap.id);
        const isFocused = state.activeApostleId === ap.id;
        const btn = document.createElement("button");
        btn.className = "apostle-chip" + (isSelected ? " active" : "");
        btn.style.backgroundColor = isSelected ? ap.color : "";
        btn.style.outline = isFocused && isSelected ? "2px solid #ffffff" : "none";
        btn.innerHTML = `<span class="chip-dot" style="background:${isSelected ? "#0b111a" : ap.color}"></span>${ap.name}`;
        btn.addEventListener("click", () => {
          if (state.selectedIds.has(ap.id)) {
            if (state.selectedIds.size > 1) {
              state.selectedIds.delete(ap.id);
            }
          } else {
            state.selectedIds.add(ap.id);
          }
          state.activeApostleId = ap.id;
          state.selectedStopIndex = 0;
          ensureSelectionValid();
          renderAll();
        });
        pillsContainer.appendChild(btn);
      });
    }

    function applyTransform() {
      viewportEl.setAttribute(
        "transform",
        `translate(${state.panX}, ${state.panY}) scale(${state.zoom})`
      );
    }

    function renderMap() {
      routesLayer.innerHTML = "";
      nodesLayer.innerHTML = "";
      labelsLayer.innerHTML = "";

      const selected = getSelectedApostles();
      const cityGroups = {};

      selected.forEach(ap => {
        const isFocused = ap.id === state.activeApostleId;
        const stops = getFilteredStops(ap);

        for (let i = 0; i < stops.length - 1; i++) {
          const fromCity = CITIES[stops[i].city];
          const toCity = CITIES[stops[i + 1].city];
          if (!fromCity || !toCity) continue;

          const activeByYear = state.year >= stops[i + 1].start;
          const isTraditional = stops[i + 1].source === "trad";

          const dx = toCity.x - fromCity.x;
          const dy = toCity.y - fromCity.y;
          const midX = (fromCity.x + toCity.x) / 2 - dy * 0.14;
          const midY = (fromCity.y + toCity.y) / 2 + dx * 0.14;

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", `M ${fromCity.x} ${fromCity.y} Q ${midX} ${midY} ${toCity.x} ${toCity.y}`);
          path.setAttribute("class", "route-path");
          path.setAttribute("stroke", ap.color);
          path.setAttribute("stroke-width", isFocused ? "3.2" : "2.1");
          path.setAttribute("opacity", activeByYear ? (isFocused ? "0.95" : "0.62") : "0.18");
          if (isTraditional) {
            path.setAttribute("stroke-dasharray", "6,5");
          }
          routesLayer.appendChild(path);
        }

        stops.forEach((st, idx) => {
          const c = CITIES[st.city];
          if (!c) return;

          if (!cityGroups[c.id]) cityGroups[c.id] = [];
          const slotIndex = cityGroups[c.id].length;
          cityGroups[c.id].push({ ap, st, idx });

          const angle = slotIndex * 1.15;
          const radiusOffset = slotIndex === 0 ? 0 : 14 + Math.floor(slotIndex / 3) * 6;
          const nx = c.x + Math.cos(angle) * radiusOffset;
          const ny = c.y + Math.sin(angle) * radiusOffset;

          const reached = state.year >= st.start;
          const isCurrent = isFocused && state.selectedStopIndex === idx;

          if (isCurrent) {
            const halo = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            halo.setAttribute("cx", nx);
            halo.setAttribute("cy", ny);
            halo.setAttribute("r", "15");
            halo.setAttribute("fill", "none");
            halo.setAttribute("stroke", "#ffffff");
            halo.setAttribute("stroke-width", "2.2");
            halo.setAttribute("opacity", "0.9");
            nodesLayer.appendChild(halo);
          }

          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", nx);
          circle.setAttribute("cy", ny);
          circle.setAttribute("r", isCurrent ? "11" : "9.5");
          circle.setAttribute("fill", ap.color);
          circle.setAttribute("stroke", "#0b111a");
          circle.setAttribute("stroke-width", "1.6");
          circle.setAttribute("opacity", reached ? "1" : "0.32");
          circle.style.cursor = "pointer";

          circle.addEventListener("click", (e) => {
            e.stopPropagation();
            state.activeApostleId = ap.id;
            state.selectedStopIndex = idx;
            state.year = st.start;
            yearSlider.value = st.start;
            renderAll();
          });

          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", nx);
          text.setAttribute("y", ny);
          text.setAttribute("class", "node-badge-text");
          text.setAttribute("opacity", reached ? "1" : "0.45");
          text.textContent = String(idx + 1);

          nodesLayer.appendChild(circle);
          nodesLayer.appendChild(text);
        });
      });

      Object.values(CITIES).forEach(c => {
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", c.x);
        label.setAttribute("y", c.y - 14);
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("class", "city-label");
        label.textContent = c.name;
        labelsLayer.appendChild(label);
      });
    }

    function renderNarrative() {
      const activeApostle = APOSTLES.find(a => a.id === state.activeApostleId) || APOSTLES[0];
      const stops = getFilteredStops(activeApostle);

      if (stops.length === 0) {
        stepCounterEl.textContent = "0 / 0";
        prevStepBtn.disabled = true;
        nextStepBtn.disabled = true;
        narrativeEl.innerHTML = `
          <div class="narrative-heading">${activeApostle.name}在此來源篩選下無對應站點</div>
          <p>請切換上方「全部來源」或改選其他門徒查看該類別記載。</p>
        `;
        return;
      }

      const safeIdx = Math.min(state.selectedStopIndex, stops.length - 1);
      const stop = stops[safeIdx];
      const city = CITIES[stop.city];

      stepCounterEl.textContent = `${safeIdx + 1} / ${stops.length}`;
      prevStepBtn.disabled = safeIdx <= 0;
      nextStepBtn.disabled = safeIdx >= stops.length - 1;

      const sourceClass = stop.source === "canon" ? "pill-source-canon" : "pill-source-trad";
      const sourceLabel = stop.source === "canon" ? "正典／早期文獻記載" : "教會傳統推估（虛線）";

      narrativeEl.innerHTML = `
        <div class="narrative-meta">
          <span class="pill-tag" style="background:${activeApostle.color}26; color:${activeApostle.color}; border-color:${activeApostle.color}88;">
            ${activeApostle.name}・第 ${safeIdx + 1} 站
          </span>
          <span class="pill-tag">${city ? city.name : ""}（約 ${stop.start}–${stop.end} AD）</span>
          <span class="pill-tag">停留約 ${stop.months} 個月</span>
          <span class="pill-tag ${sourceClass}">${sourceLabel}</span>
        </div>
        <div class="narrative-heading">${stop.title}</div>
        <p>${stop.desc}</p>
        <p style="margin-top:6px; font-size:14px; color:var(--text-muted);">文獻／經文依據：${stop.ref}</p>
      `;
    }

    function renderDurationChart() {
      const selected = getSelectedApostles();
      const cityMap = new Map();

      selected.forEach(ap => {
        const stops = getFilteredStops(ap);
        stops.forEach((st, idx) => {
          const c = CITIES[st.city];
          if (!c) return;
          if (!cityMap.has(c.id)) {
            cityMap.set(c.id, {
              cityId: c.id,
              cityName: c.name,
              totalMonths: 0,
              segments: []
            });
          }
          const entry = cityMap.get(c.id);
          entry.totalMonths += st.months;
          entry.segments.push({
            apostleId: ap.id,
            apostleName: ap.name,
            color: ap.color,
            months: st.months,
            stopIndex: idx,
            startYear: st.start
          });
        });
      });

      const rows = Array.from(cityMap.values()).sort((a, b) => b.totalMonths - a.totalMonths);
      const maxMonths = rows.length > 0 ? Math.max(...rows.map(r => r.totalMonths)) : 1;
      const grandTotal = rows.reduce((acc, r) => acc + r.totalMonths, 0);
      totalMonthsBadge.textContent = `合計 ${grandTotal} 個月`;

      const activeApostle = APOSTLES.find(a => a.id === state.activeApostleId) || APOSTLES[0];
      const activeStops = getFilteredStops(activeApostle);
      const currentStop = activeStops[state.selectedStopIndex];

      durationListEl.innerHTML = "";
      if (rows.length === 0) {
        durationListEl.innerHTML = `<p style="color:var(--text-muted); font-size:15px;">目前篩選條件下無停留月數資料。</p>`;
        return;
      }

      rows.forEach(row => {
        const isSelectedCity = currentStop && currentStop.city === row.cityId;
        const rowEl = document.createElement("div");
        rowEl.className = "duration-row" + (isSelectedCity ? " selected" : "");

        const segHtml = row.segments.map(seg => {
          const widthPct = (seg.months / maxMonths) * 100;
          return `<div class="bar-seg" style="width:${widthPct.toFixed(1)}%; background:${seg.color};" title="${seg.apostleName}：${seg.months} 個月"></div>`;
        }).join("");

        const detailText = row.segments.map(s => `${s.apostleName} ${s.months}M`).join("、");

        rowEl.innerHTML = `
          <div class="duration-row-top">
            <span>${row.cityName}</span>
            <span class="duration-val">${row.totalMonths} 個月</span>
          </div>
          <div class="bar-track">${segHtml}</div>
          <div class="bar-caption">
            <span>${detailText}</span>
            <span>點擊跳轉</span>
          </div>
        `;

        rowEl.addEventListener("click", () => {
          const preferred = row.segments.find(s => s.apostleId === state.activeApostleId) || row.segments[0];
          if (preferred) {
            state.activeApostleId = preferred.apostleId;
            state.selectedStopIndex = preferred.stopIndex;
            state.year = preferred.startYear;
            yearSlider.value = preferred.startYear;
            renderAll();
          }
        });

        durationListEl.appendChild(rowEl);
      });
    }

    function renderAll() {
      ensureSelectionValid();
      yearHud.textContent = `${state.year} AD`;
      renderPills();
      renderMap();
      renderNarrative();
      renderDurationChart();
    }

    document.querySelectorAll(".source-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".source-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.sourceFilter = btn.dataset.source;
        state.selectedStopIndex = 0;
        renderAll();
      });
    });

    prevStepBtn.addEventListener("click", () => {
      const ap = APOSTLES.find(a => a.id === state.activeApostleId);
      const stops = getFilteredStops(ap);
      if (stops.length > 0 && state.selectedStopIndex > 0) {
        state.selectedStopIndex -= 1;
        state.year = stops[state.selectedStopIndex].start;
        yearSlider.value = state.year;
        renderAll();
      }
    });

    nextStepBtn.addEventListener("click", () => {
      const ap = APOSTLES.find(a => a.id === state.activeApostleId);
      const stops = getFilteredStops(ap);
      if (stops.length > 0 && state.selectedStopIndex < stops.length - 1) {
        state.selectedStopIndex += 1;
        state.year = stops[state.selectedStopIndex].start;
        yearSlider.value = state.year;
        renderAll();
      }
    });

    yearSlider.addEventListener("input", (e) => {
      state.year = Number(e.target.value);
      renderAll();
    });

    document.querySelectorAll(".ms-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const y = Number(btn.dataset.year);
        state.year = y;
        yearSlider.value = y;
        renderAll();
      });
    });

    function stopPlayback() {
      state.playing = false;
      playBtn.textContent = "▶ 播放";
      playBtn.classList.remove("active-play");
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
    }

    function startPlayback() {
      stopPlayback();
      state.playing = true;
      playBtn.textContent = "❚❚ 暫停";
      playBtn.classList.add("active-play");
      const intervalMs = state.playSpeed === 1 ? 450 : 220;
      playTimer = setInterval(() => {
        if (state.year >= 100) {
          state.year = 30;
        } else {
          state.year += 1;
        }
        yearSlider.value = state.year;
        renderAll();
      }, intervalMs);
    }

    playBtn.addEventListener("click", () => {
      if (state.playing) stopPlayback();
      else startPlayback();
    });

    speedBtn.addEventListener("click", () => {
      state.playSpeed = state.playSpeed === 1 ? 2 : 1;
      speedBtn.textContent = `${state.playSpeed}x`;
      if (state.playing) startPlayback();
    });

    document.getElementById("zoom-in").addEventListener("click", () => {
      state.zoom = Math.min(2.6, +(state.zoom + 0.25).toFixed(2));
      applyTransform();
    });

    document.getElementById("zoom-out").addEventListener("click", () => {
      state.zoom = Math.max(0.8, +(state.zoom - 0.25).toFixed(2));
      applyTransform();
    });

    document.getElementById("zoom-reset").addEventListener("click", () => {
      state.zoom = 1;
      state.panX = 0;
      state.panY = 0;
      applyTransform();
    });

    svgEl.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.15 : -0.15;
      state.zoom = Math.min(2.6, Math.max(0.8, +(state.zoom + delta).toFixed(2)));
      applyTransform();
    }, { passive: false });

    svgEl.addEventListener("pointerdown", (e) => {
      if (e.target.tagName === "circle") return;
      state.isDragging = true;
      state.dragStartX = e.clientX - state.panX;
      state.dragStartY = e.clientY - state.panY;
      svgEl.classList.add("dragging");
    });

    window.addEventListener("pointermove", (e) => {
      if (!state.isDragging) return;
      state.panX = e.clientX - state.dragStartX;
      state.panY = e.clientY - state.dragStartY;
      applyTransform();
    });

    window.addEventListener("pointerup", () => {
      state.isDragging = false;
      svgEl.classList.remove("dragging");
    });

    renderAll();
  </script>
</body>
</html>
